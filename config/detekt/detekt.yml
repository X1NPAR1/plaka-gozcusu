# Project overrides on top of detekt defaults (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  TooManyFunctions:
    # Classes implementing a wide platform interface (CameraController) or a screen's VM actions.
    thresholdInClasses: 15
    # Room DAOs and repositories are deliberately wide API surfaces over one table.
    ignoreAnnotated: ['Dao', 'Singleton']
  LongParameterList:
    # Composables legitimately take many parameters (modifier, state, callbacks).
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    # Design tokens and previews are declared as named constants in token files.
    ignorePropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**', '**/designsystem/theme/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    # Early-return guard clauses are the clearest way to handle "camera not bound / not supported".
    max: 3
    excludeGuardClauses: true
