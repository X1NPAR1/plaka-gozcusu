# Memory tuned for a 16 GB machine running the IDE as well (a 4 GB daemon + separate Kotlin
# daemons exhausted the Windows commit limit during Phase 3). Kotlin compiles in-process.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.workers.max=4
# Build cache disabled: a corrupt (empty) cached jar for :core:model caused phantom "unresolved" errors.
org.gradle.caching=false
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
# AGP 9 defaults (builtInKotlin, newDsl, useAndroidx) are kept at their defaults on purpose.
# Incremental Kotlin + in-process compiler intermittently compiled tests against stale main classes
# ("Unresolved reference PipelineConfig"). Full module compiles are reliable and still fast enough here.
kotlin.incremental=false
